# Shared values come from tiers/<tier>/release.yaml (promoted);
# tier-only values and remediation from tiers/<tier>/tier.yaml (never promoted).
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: prometheus
spec:
  interval: 10m
  releaseName: prometheus
  chartRef:
    kind: OCIRepository
    name: prometheus
  install:
    remediation:
      retries: 0
  test:
    enable: true
    ignoreFailures: false
