# TIER-ONLY (prd): never promoted. Tells this app's GitHub repo when its Helm
# smoke tests fail here (Flux keeps rolling back stg/prd on its own).
#
# Promotion evidence doesn't come from here any more: the behaviour tests run in
# Testkube and report (signed) through promo-fleet's promo-report step; see
# promo-fleet NOTES.md "Test evidence".
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Alert
metadata:
  name: promote-failure
  namespace: prometheus
spec:
  providerRef:
    name: promo-dispatch
  eventSeverity: error
  eventSources:
    - kind: HelmRelease
      name: prometheus
  # Only release failures; not transient errors such as a source not ready yet.
  inclusionList:
    - "^Helm (install|upgrade|test) failed"
  eventMetadata:
    tier: prd
    app: prometheus
---
# Token: Secret promo-dispatch (key token), created by promo-fleet's task up
# from ~/.config/promo/dispatch-prd.token. Never in Git.
apiVersion: notification.toolkit.fluxcd.io/v1
kind: Provider
metadata:
  name: promo-dispatch
  namespace: prometheus
spec:
  type: githubdispatch
  address: https://github.com/twallac10/promo-prometheus
  secretRef:
    name: promo-dispatch
