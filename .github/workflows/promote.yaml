# Flux (tiers/<tier>/notify.yaml: smoke-test failures) and Testkube (promo-fleet's
# promo-report: behaviour test results) send repository_dispatch events here; the
# reusable workflow turns them into signed evidence, Deployments and PRs.
name: promote
on:
  repository_dispatch:
    types: [HelmRelease/prometheus.prometheus, TestReport/prometheus.prometheus]
permissions:
  contents: read
  id-token: write      # keyless signing of the test-result attestation
  attestations: write
  packages: write      # junit artifact and attestation on the chart in GHCR
jobs:
  promote:
    uses: twallac10/promo-workflows/.github/workflows/promote.yaml@v0.6.0
    # Only the promo App credentials, not every repo secret.
    secrets:
      PROMO_APP_ID: ${{ secrets.PROMO_APP_ID }}
      PROMO_APP_PRIVATE_KEY: ${{ secrets.PROMO_APP_PRIVATE_KEY }}
