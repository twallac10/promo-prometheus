name: mirror
on:
  push:
    branches: [main]
    paths:
      - mirror/chart.yaml
      - chart/**
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  mirror:
    uses: twallac10/promo-workflows/.github/workflows/mirror.yaml@v0.6.0
    # Only the promo App credentials, not every repo secret.
    secrets:
      PROMO_APP_ID: ${{ secrets.PROMO_APP_ID }}
      PROMO_APP_PRIVATE_KEY: ${{ secrets.PROMO_APP_PRIVATE_KEY }}
